/* ===== CONTEXTS ===== */
const AuthCtx = createContext();
function useAuth(){return useContext(AuthCtx)}

function AuthProvider({children}){
  const[user,setUser]=useState(null);
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    document.getElementById('loader').style.display='none';
    const unsub = auth.onAuthStateChanged(u=>{
      setUser(u);
      setLoading(false);
      if(u){
        db.collection('users').doc(u.uid).set({
          displayName:u.displayName||u.email.split('@')[0],
          email:u.email,
          lastSeen:firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});
      }
    });
    return unsub;
  },[]);
  return <AuthCtx.Provider value={{user,loading}}>{children}</AuthCtx.Provider>
}

const StatsCtx = createContext();
function useStats(){return useContext(StatsCtx)}

function StatsProvider({children}){
  const{user}=useAuth();
  const key=user?`11d-stats-${user.uid}`:'11d-stats-guest';
  const[stats,setStats]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):{...INIT_STATS}}catch(e){return{...INIT_STATS}}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(stats))}catch(e){}},[stats,key]);
  useEffect(()=>{const now=new Date();const h=now.getHours();setStats(prev=>({...prev,earliestStudy:prev.earliestStudy||h<8,latestStudy:prev.latestStudy||h>=22}))},[]);
  const update=p=>setStats(prev=>({...prev,...p}));
  return <StatsCtx.Provider value={{stats,update}}>{children}</StatsCtx.Provider>
}

/* ===== TEACHER CONTEXT ===== */
const TeacherCtx = createContext();
function useTeacher(){return useContext(TeacherCtx)}

function TeacherProvider({children}){
  const{user}=useAuth();
  const[isTeacher,setIsTeacher]=useState(false);
  useEffect(()=>{
    if(!user)return;
    const unsub=db.collection('users').doc(user.uid).onSnapshot(doc=>{
      setIsTeacher(doc.exists&&doc.data().role==='teacher');
    });
    return unsub;
  },[user]);
  const authenticateTeacher=async(code)=>{
    if(code==='11DTEACH'){
      await db.collection('users').doc(user.uid).set({
        role:'teacher',
        displayName:user.displayName||user.email,
        email:user.email
      },{merge:true});
      return true;
    }
    return false;
  };
  const removeTeacher=async()=>{
    await db.collection('users').doc(user.uid).set({role:'student'},{merge:true});
  };
  return <TeacherCtx.Provider value={{isTeacher,authenticateTeacher,removeTeacher}}>{children}</TeacherCtx.Provider>
}

function getAI(input){const l=input.toLowerCase().trim();if(/^(hi|hello|hey|howzit|sup)\b/.test(l))return pick(["Hey! Ask about subjects, quizzes, or just chat!","Ready to study? Type a subject or ask for a quiz."]);if(/quiz|test me/i.test(l)){return{type:'quiz',data:pick(QUIZZES)}}if(/study tip/i.test(l))return pick(TIPS);if(/motivat|tired|stressed/i.test(l))return pick(MOTIVATE);if(/thank/i.test(l))return pick(["You're welcome!","Anytime!"]);for(const[k,v]of Object.entries(AI_HELP)){if(v.p.some(p=>l.includes(p)))return pick(v.r)}if(/help/i.test(l))return "I can help with:\n- Study tips\n- Quiz questions\n- Subject guidance\n- Motivation";return pick(["Try asking about a subject, or type 'help'.","Ask about Business, Economics, English, Math, History, or languages!"])}

function useInView(th=.1){const r=useRef(null),[v,setV]=useState(false);useEffect(()=>{const e=r.current;if(!e)return;const o=new IntersectionObserver(([x])=>{if(x.isIntersecting){setV(true);o.disconnect()}},{threshold:th});o.observe(e);return()=>o.disconnect()},[]);return[r,v]}

/* ═══════════════════════════════════════════
   LOGIN / SIGNUP SCREEN
   ═══════════════════════════════════════════ */
function LoginScreen(){
  const[tab,setTab]=useState('login');
  const[email,setEmail]=useState('');
  const[pass,setPass]=useState('');
  const[name,setName]=useState('');
  const[showPass,setShowPass]=useState(false);
  const[error,setError]=useState('');
  const[loading,setLoading]=useState(false);
  const[resetSent,setResetSent]=useState(false);

  const doLogin=async e=>{e.preventDefault();setError('');setLoading(true);try{await auth.signInWithEmailAndPassword(email,pass)}catch(err){setError(err.code==='auth/user-not-found'?'No account found with this email.':err.code==='auth/invalid-credential'?'Invalid email or password.':err.message)}finally{setLoading(false)}};
  const doSignup=async e=>{e.preventDefault();setError('');setLoading(true);if(name.trim().length<2){setError('Please enter your name (at least 2 characters).');setLoading(false);return}try{const cred=await auth.createUserWithEmailAndPassword(email,pass);await cred.user.updateProfile({displayName:name.trim()})}catch(err){setError(err.code==='auth/email-already-in-use'?'This email is already registered. Try logging in.':err.code==='auth/weak-password'?'Password must be at least 6 characters.':err.message)}finally{setLoading(false)}};
  const doGoogle=async()=>{setError('');setLoading(true);try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(err){if(err.code!=='auth/popup-closed-by-user')setError(err.message)}finally{setLoading(false)}};
  const doReset=async()=>{if(!email){setError('Enter your email above first, then tap Forgot Password.');return}setError('');setResetSent(false);try{await auth.sendPasswordResetEmail(email);setResetSent(true)}catch(err){setError(err.code==='auth/user-not-found'?'No account with this email.':err.message)}};

  return(
    <div className="fixed inset-0 flex items-center justify-center" style={{background:'#060b14',zIndex:999,padding:16}}>
      <div className="absolute rounded-full" style={{top:'10%',left:'5%',width:300,height:300,background:'radial-gradient(circle,rgba(16,185,129,.12) 0%,transparent 70%)',filter:'blur(60px)',animation:'orbFloat 12s ease-in-out infinite'}}/>
      <div className="absolute rounded-full" style={{bottom:'10%',right:'5%',width:250,height:250,background:'radial-gradient(circle,rgba(52,211,153,.08) 0%,transparent 70%)',filter:'blur(50px)',animation:'orbFloat2 15s ease-in-out infinite'}}/>
      <div className="glass w-full" style={{maxWidth:400,borderRadius:24,animation:'scaleIn .5s ease',position:'relative',overflow:'hidden'}}>
        <div style={{height:3,background:'linear-gradient(90deg,#10b981,#6ee7b7,#10b981)'}}/>
        <div className="p-6 sm:p-8">
          <div className="text-center mb-6">
            <div className="mx-auto flex items-center justify-center rounded-2xl mb-3" style={{width:56,height:56,background:'linear-gradient(135deg,#10b981,#059669)',boxShadow:'0 0 30px rgba(16,185,129,.25)'}}>
              <div className="flex items-center justify-center rounded-xl font-heading" style={{width:40,height:40,fontSize:16,fontWeight:800,color:'#fff',letterSpacing:'-0.5px'}}>G11</div>
            </div>
            <h1 className="font-heading font-bold text-xl" style={{color:'#ecfdf5'}}>Class 11D Hub</h1>
            <p className="text-xs mt-1" style={{color:'#64748b'}}>Sign in to connect with your class</p>
          </div>
          <div className="flex p-1 rounded-xl mb-6" style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.06)'}}>
            {['login','signup'].map(t=>(<button key={t} onClick={()=>{setTab(t);setError('');setResetSent(false)}} className="flex-1 py-2.5 rounded-lg text-xs font-heading font-semibold transition-all" style={{background:tab===t?'linear-gradient(135deg,#10b981,#059669)':'transparent',color:tab===t?'#fff':'#64748b',boxShadow:tab===t?'0 2px 8px rgba(16,185,129,.25)':'none'}}>{t==='login'?'Sign In':'Sign Up'}</button>))}
          </div>
          {error&&<div className="mb-4 p-3 rounded-xl text-xs" style={{background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.2)',color:'#fca5a5'}}>{error}</div>}
          {resetSent&&<div className="mb-4 p-3 rounded-xl text-xs" style={{background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.2)',color:'#6ee7b7'}}>Password reset email sent! Check your inbox.</div>}
          <form onSubmit={tab==='login'?doLogin:doSignup} className="space-y-3">
            {tab==='signup'&&(<div className="relative"><div className="absolute left-3.5 top-1/2 -translate-y-1/2" style={{color:'#475569'}}><Icon name="user" size={18}/></div><input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Your display name" className="login-input" required/></div>)}
            <div className="relative"><div className="absolute left-3.5 top-1/2 -translate-y-1/2" style={{color:'#475569'}}><Icon name="mail" size={18}/></div><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email address" className="login-input" required/></div>
            <div className="relative"><div className="absolute left-3.5 top-1/2 -translate-y-1/2" style={{color:'#475569'}}><Icon name="lock" size={18}/></div><input type={showPass?'text':'password'} value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password" className="login-input" style={{paddingRight:44}} required/><button type="button" onClick={()=>setShowPass(!showPass)} className="absolute right-3.5 top-1/2 -translate-y-1/2" style={{background:'transparent',border:'none',color:'#64748b',cursor:'pointer'}}><Icon name={showPass?'eye-off':'eye'} size={18}/></button></div>
            {tab==='login'&&(<div className="text-right"><button type="button" onClick={doReset} className="text-xs font-medium" style={{background:'transparent',border:'none',color:'#6ee7b7',cursor:'pointer'}}>Forgot password?</button></div>)}
            <button type="submit" disabled={loading} className="w-full py-3 rounded-xl font-heading font-semibold text-sm transition-all active:scale-95 flex items-center justify-center gap-2" style={{background:loading?'rgba(16,185,129,.3)':'linear-gradient(135deg,#10b981,#059669)',color:'#fff',border:'none',boxShadow:'0 4px 14px rgba(16,185,129,.25)'}}>{loading&&<div style={{width:16,height:16,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'#fff',borderRadius:'50%',animation:'spin .6s linear infinite'}}/>}{tab==='login'?'Sign In':'Create Account'}</button>

/* ===== TIMETABLE ===== */
function Timetable(){
  const[activeDay,setActiveDay]=useState(getActiveDay);
  const[now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),60000);return()=>clearInterval(t)},[]);
  const[r,v]=useInView();
  const periods=TIMETABLE[activeDay]||[];
  const livePeriod=getCurrentPeriod(periods);
  const isSchool=now.getHours()>=8&&now.getHours()<15;
  const isToday=k=>{const m={monday:1,tuesday:2,wednesday:3,thursday:4,friday1:5,friday2:5};const d=now.getDay();if(m[k]!==d)return false;if(d===5){const dt=now.getDate(),fd=new Date(now.getFullYear(),now.getMonth(),1).getDay(),w=Math.ceil((dt+(fd<=5?fd:7-fd))/7);return w%2===1?k==='friday1':k==='friday2'}return true};
  return(
    <section id="timetable" ref={r} className={`py-6 px-4 max-w-2xl mx-auto ${v?'anim-fade-up':''}`}>
      <div className="flex items-center gap-2.5 mb-5"><div className="flex items-center justify-center rounded-xl" style={{width:32,height:32,background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.2)'}}><Icon name="calendar" size={16} className="text-emerald-400"/></div><div><h2 className="font-heading font-bold text-lg" style={{color:'#ecfdf5'}}>Timetable</h2><p className="text-xs" style={{color:'#64748b'}}>Weekly Schedule</p></div>{livePeriod&&isSchool&&isToday(activeDay)&&<div className="ml-auto flex items-center gap-1.5 px-2.5 py-1 rounded-full live-bar" style={{background:'rgba(16,185,129,.12)',border:'1px solid rgba(16,185,129,.25)'}}><div className="w-1.5 h-1.5 rounded-full" style={{background:'#10b981'}}/><span className="text-xs font-semibold" style={{color:'#6ee7b7'}}>Now: {SUBJECT_COLORS[periods[livePeriod.i].sub]?.full}</span></div>}</div>
      <div className="glass p-1.5 mb-4 day-tabs flex gap-1 overflow-x-auto" style={{borderRadius:14}}>
        {DAY_TABS.map(t=><button key={t.key} onClick={()=>setActiveDay(t.key)} className="flex-shrink-0 flex-1 py-2.5 px-2 rounded-xl text-center" style={{background:activeDay===t.key?'rgba(16,185,129,.15)':'transparent',border:activeDay===t.key?'1px solid rgba(16,185,129,.3)':'1px solid transparent',color:activeDay===t.key?'#6ee7b7':'#64748b'}}><span className="font-heading font-semibold text-xs">{t.label}</span>{isToday(t.key)&&<div className="mx-auto mt-1 rounded-full" style={{width:5,height:5,background:'#10b981'}}/>}</button>)}
      </div>
      <div className="space-y-2">
        {periods.map((p,i)=>{const info=SUBJECT_COLORS[p.sub];const live=livePeriod&&livePeriod.i===i&&isToday(activeDay)&&isSchool;const gap=()=>{if(i===0)return null;const[peH,peM]=periods[i-1].time.split('–')[1].trim().split(':').map(Number),[csH,csM]=p.time.split('–')[0].trim().split(':').map(Number);const g=(csH*60+csM)-(peH*60+peM);if(g>=45)return<div key={'g'+i} className="flex items-center gap-2 py-1.5"><div className="flex-1 h-px" style={{background:'rgba(255,255,255,.06)'}}/><span className="text-xs flex items-center gap-1" style={{color:'#475569',fontSize:10}}><Icon name="coffee" size={11}/> {g>=60?'Lunch':'Break'}</span><div className="flex-1 h-px" style={{background:'rgba(255,255,255,.06)'}}/></div>;return null};return<React.Fragment key={i}>{gap()}<div className="glass overflow-hidden" style={{borderRadius:14,borderLeft:`3px solid ${live?info.border:info.border+'40'}`,background:live?info.bg:'var(--glass-bg)',animation:'fadeUp .4s ease forwards',opacity:0,animationDelay:`${i*.06}s`}}><div className="flex items-center gap-3 p-3.5"><div className="flex-shrink-0 text-center" style={{minWidth:72}}><span className="text-xs font-heading font-semibold block" style={{color:live?info.text:'#94a3b8'}}>{p.time.split('–')[0].trim()}</span><span className="text-xs block" style={{color:'#475569',fontSize:9}}>{p.time.split('–')[1].trim()}</span></div><div className="flex-shrink-0 h-8" style={{width:1,background:live?`${info.border}40`:'rgba(255,255,255,.06)'}}/><div className="flex-1 min-w-0"><div className="flex items-center gap-2"><h4 className="font-heading font-semibold text-sm truncate" style={{color:live?'#ecfdf5':p.sub==='FREE'||p.sub==='END'?'#475569':'#d1fae5'}}>{info.full}</h4>{live&&<span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{background:`${info.border}20`,color:info.text,fontSize:9}}>NOW</span>}</div><span className="text-xs" style={{color:'#475569',fontSize:11}}>{p.sub==='FREE'||p.sub==='END'?'':'Room 11D'}</span></div><div className="flex-shrink-0 flex items-center justify-center rounded-xl" style={{width:40,height:40,background:`${info.border}08`,border:`1px solid ${info.border}10`}}><span className="font-heading font-bold text-xs" style={{color:info.text+'80'}}>{p.sub}</span></div></div>{live&&livePeriod&&<div className="px-3.5 pb-2"><div className="flex items-center justify-between mb-1"><span className="text-xs" style={{color:'#475569',fontSize:9}}>Progress</span><span className="text-xs font-semibold" style={{color:info.text,fontSize:9}}>{livePeriod.remaining}m left</span></div><div className="w-full rounded-full overflow-hidden" style={{height:3,background:'rgba(255,255,255,.06)'}}><div className="h-full rounded-full" style={{width:`${((60-livePeriod.remaining)/60)*100}%`,background:`linear-gradient(90deg,${info.border},${info.text})`,transition:'width 1s linear'}}/></div></div>}</div></React.Fragment>})}
      </div>
    </section>
  );
}

/* ═══════════════════════════════════════════
   CLASS CHAT (NEW)
   ═══════════════════════════════════════════ */
function ClassChat(){
  const{user}=useAuth();
  const[msgs,setMsgs]=useState([]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(true);
  const scrollRef=useRef(null);
  const inputRef=useRef(null);
  const[r,v]=useInView();

  useEffect(()=>{
    const unsub=db.collection('chats').orderBy('timestamp','asc').limitToLast(200).onSnapshot(snap=>{
      setMsgs(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },()=>setLoading(false));
    return unsub;
  },[]);

  useEffect(()=>{
    if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;
  },[msgs]);

  const send=async()=>{
    if(!input.trim()||!user)return;
    const text=input.trim();setInput('');
    try{await db.collection('chats').add({userId:user.uid,displayName:user.displayName||user.email.split('@')[0],text,timestamp:firebase.firestore.FieldValue.serverTimestamp(),color:uidColor(user.uid)})}catch(e){console.error(e)}
  };

  const delMsg=async(id)=>{try{await db.collection('chats').doc(id).delete()}catch(e){}};

  const grouped=useMemo(()=>{
    const g=[];let last=null;
    msgs.forEach(m=>{
      if(last&&last.userId===m.userId){last.items.push(m)}
      else{last={userId:m.userId,displayName:m.displayName,color:m.color,items:[m]};g.push(last)}
    });
    return g;
  },[msgs]);

  return(
    <section id="classchat" ref={r} className={`py-6 px-4 max-w-2xl mx-auto ${v?'anim-fade-up':''}`}>
      <div className="flex items-center gap-2.5 mb-5">
        <div className="flex items-center justify-center rounded-xl" style={{width:32,height:32,background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)'}}><Icon name="message-circle" size={16} style={{color:'#60a5fa'}}/></div>
        <div><h2 className="font-heading font-bold text-lg" style={{color:'#ecfdf5'}}>Class Chat</h2><p className="text-xs" style={{color:'#64748b'}}>Real-time conversation</p></div>
        <div className="ml-auto flex items-center gap-1.5 px-2.5 py-1 rounded-full" style={{background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.15)'}}><div className="w-1.5 h-1.5 rounded-full" style={{background:'#10b981',animation:'pulse 2s infinite'}}/><span className="text-xs font-medium" style={{color:'#6ee7b7'}}>Live</span></div>
      </div>

      <div className="glass overflow-hidden" style={{borderRadius:20}}>
        {/* Messages area */}
        <div ref={scrollRef} className="chat-scroll" style={{height:420,overflowY:'auto',padding:'16px'}}>
          {loading?<div className="flex items-center justify-center h-full"><div style={{width:28,height:28,border:'3px solid rgba(16,185,129,.2)',borderTopColor:'#10b981',borderRadius:'50%',animation:'spin .8s linear infinite'}}/></div>:
          msgs.length===0?<div className="flex flex-col items-center justify-center h-full" style={{color:'#475569'}}><Icon name="message-circle" size={40} style={{opacity:.2,marginBottom:8}}/><p className="text-sm">No messages yet. Say hi!</p></div>:
          grouped.map((g,gi)=>{
            const isMe=g.userId===user.uid;
            return(
              <div key={gi} className={`flex ${isMe?'justify-end':'justify-start'} mb-3`}>
                {!isMe&&<div className="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold mr-2 mt-1" style={{background:`${g.color}20`,color:g.color}}>{(g.displayName||'?')[0].toUpperCase()}</div>}
                <div style={{maxWidth:'78%'}}>
                  {!isMe&&<p className="text-xs font-semibold mb-1 ml-1" style={{color:g.color}}>{g.displayName}</p>}
                  {g.items.map((m,mi)=>(
                    <div key={m.id} className={`msg-bubble relative group ${isMe?'ml-auto':''}`} style={{marginBottom:mi<g.items.length-1?4:0}}>
                      <div className="px-3.5 py-2 rounded-2xl" style={{background:isMe?'linear-gradient(135deg,#10b981,#059669)':'rgba(255,255,255,.07)',border:isMe?'none':'1px solid rgba(255,255,255,.06)',borderRadius:isMe?'18px 18px 4px 18px':'18px 18px 18px 4px'}}>
                        <p className="text-sm" style={{color:isMe?'#fff':'#d1fae5',lineHeight:1.45,wordBreak:'break-word'}}>{m.text}</p>
                      </div>
                      <div className={`flex items-center gap-1.5 mt-0.5 ${isMe?'justify-end':'justify-start'} px-1`} style={{opacity:0,transition:'.2s'}} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0}>
                        <span style={{color:'#475569',fontSize:9}}>{timeAgo(m.timestamp)}</span>
                        {isMe&&<button onClick={()=>delMsg(m.id)} style={{background:'none',border:'none',color:'#475569',cursor:'pointer',padding:0,lineHeight:1}}><Icon name="trash" size={10}/></button>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {/* Quick replies */}
        <div className="px-4 py-2 flex gap-2 overflow-x-auto day-tabs" style={{borderTop:'1px solid rgba(255,255,255,.04)'}}>
          {['Hey!','Who\'s studying?','Need help','See you at school','Good luck!'].map(q=><button key={q} onClick={()=>{setInput(q);setTimeout(()=>inputRef.current?.focus(),50)}} className="flex-shrink-0 px-3 py-1 rounded-full text-xs font-medium" style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.06)',color:'#94a3b8',whiteSpace:'nowrap'}}>{q}</button>)}
        </div>

        {/* Input */}
        <div className="p-3 flex gap-2" style={{borderTop:'1px solid rgba(255,255,255,.04)'}}>
          <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}} placeholder="Type a message..." className="flex-1 px-4 py-2.5 rounded-xl text-sm outline-none" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#ecfdf5'}}/>
          <button onClick={send} className="flex items-center justify-center rounded-xl active:scale-95" style={{width:44,height:44,background:input.trim()?'linear-gradient(135deg,#10b981,#059669)':'rgba(255,255,255,.06)',border:'none',flexShrink:0,transition:'.2s'}}><Icon name="send" size={18} className="text-white"/></button>
        </div>
      </div>
    </section>
  );
}

          </div>
          :
          <button onClick={()=>setShowLogin(!showLogin)} className="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold" style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',color:'#94a3b8'}}><Icon name="lock" size={13}/> Teacher Mode</button>
        }
      </div>
      {showLogin&&!isTeacher&&(
        <form onSubmit={doAuth} className="glass p-4 mb-4" style={{borderRadius:14,animation:'fadeUp .3s ease'}}>
          <p className="text-xs mb-2" style={{color:'#94a3b8'}}>Enter teacher passcode to add content:</p>
          <div className="flex gap-2">
            <input type="password" value={code} onChange={e=>setCode(e.target.value)} placeholder="Passcode" className="flex-1 px-3 py-2 rounded-xl text-sm outline-none" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#ecfdf5'}}/>
            <button type="submit" disabled={loading} className="px-4 py-2 rounded-xl text-xs font-semibold" style={{background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',border:'none'}}>{loading?'...':'Unlock'}</button>
          </div>
          {err&&<p className="text-xs mt-2" style={{color:'#fca5a5'}}>{err}</p>}
          <p className="text-xs mt-2" style={{color:'#475569'}}>Default: <code style={{color:'#6ee7b7'}}>11DTEACH</code></p>
        </form>
      )}
      {children}
    </div>
  );
}

function HomeworkSection(){
  const{user}=useAuth();

    },()=>{});
    return unsub;
  },[]);

  const add=async e=>{
    e.preventDefault();
    if(!form.title.trim())return;
    try{await db.collection('homework').add({
      subject:form.subject,title:form.title.trim(),description:form.description.trim(),dueDate:form.dueDate,
      postedBy:user.uid,postedByName:user.displayName||user.email.split('@')[0],

    });setForm({subject:'business',title:'',description:'',dueDate:''});setShowForm(false)}catch(e){console.error(e)}
  };

  const toggleDone=async(id,completed)=>{
    try{const ref=db.collection('homework').doc(id);
    if((completed||[]).includes(user.uid)){await ref.update({completed:firebase.firestore.FieldValue.arrayRemove(user.uid)})}

        {showForm&&isTeacher&&(
          <form onSubmit={add} className="glass p-4 mb-4 space-y-3" style={{borderRadius:16,animation:'fadeUp .3s ease'}}>
            <div className="grid grid-cols-2 gap-3">

            </div>
            <div><label className="text-xs mb-1 block" style={{color:'#64748b'}}>Title</label><input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Chapter 3 Questions" className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#ecfdf5'}} required/></div>
            <div><label className="text-xs mb-1 block" style={{color:'#64748b'}}>Description</label><textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Details about the assignment..." rows={3} className="w-full px-3 py-2 rounded-xl text-sm outline-none resize-none" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#ecfdf5'}}/></div>

                  </div>
                </div>
              </div>
            );
          })}
        </div>}
      </TeacherGate>
    </section>
  );
}

            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs mb-1 block" style={{color:'#64748b'}}>Subject</label><select value={form.subject} onChange={e=>setForm({...form,subject:e.target.value})} className="w-full px-3 py-2 rounded-xl text-sm outline-none" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#ecfdf5'}}>{SUBJECT_LIST.map(s=><option key={s.id} value={s.id} style={{background:'#0f172a'}}>{s.name}</option>)}</select></div>

            <div className="space-y-2">
              {subjects.map(sid=>{
                const sMarks=myMarks.filter(m=>m.subject===sid);

                    <span className="font-heading font-bold text-sm" style={{color:gc}}>{g}</span>
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-0.5">
                      <h4 className="font-heading font-semibold text-sm truncate" style={{color:'#ecfdf5'}}>{m.title}</h4>
                      <span className="text-xs px-1.5 py-0.5 rounded-full flex-shrink-0" style={{background:`${sc}15`,color:sc,fontSize:9}}>{subName(m.subject)}</span>
                    </div>
                    {isTeacher&&<p className="text-xs" style={{color:'#64748b'}}>{m.studentName}</p>}
                    {!isTeacher&&<p className="text-xs" style={{color:'#475569',fontSize:10}}>{formatDate(m.timestamp)}</p>}
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <div className="text-right">
                      <div className="font-heading font-bold text-base" style={{color:gc}}>{m.score}<span className="text-xs font-normal" style={{color:'#475569'}}>/{m.maxScore}</span></div>
                      <div className="text-xs font-semibold" style={{color:gc,fontSize:10}}>{pct}%</div>
                    </div>
                    {isTeacher&&<button onClick={()=>delMark(m.id)} className="p-1.5 rounded-lg" style={{background:'rgba(239,68,68,.08)',border:'none',color:'#fca5a5',cursor:'pointer'}}><Icon name="trash" size={13}/></button>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>}
      </TeacherGate>
    </section>
  );
}

  const[questions,setQuestions]=useState([]);
  const[cur,setCur]=useState(0);

  const[showNext,setShowNext]=useState(false);

/* ===== POMODORO ===== */
function Pomodoro(){
  const{stats,update}=useStats();
  const W=25*60,B=5*60;const[t,setT]=useState(W),[run,setRun]=useState(false),[mode,setMode]=useState('work');const ref=useRef(null);
  useEffect(()=>{if(!run)return;ref.current=setInterval(()=>setT(p=>{if(p<=1){clearInterval(ref.current);if(mode==='work'){setMode('break');update({pomodoros:stats.pomodoros+1});return B}setMode('work');return W}return p-1}),1000);return()=>clearInterval(ref.current)},[run,mode]);
  const pct=t/(mode==='work'?W:B),circ=2*Math.PI*42,off=circ*(1-pct),m=Math.floor(t/60),s=t%60;const[r,v]=useInView();
  return(
    <section id="timer" ref={r} className={`py-6 px-4 max-w-2xl mx-auto ${v?'anim-fade-up':''}`}>

        <div className="inline-block mb-3"><svg width="160" height="160" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.05)" strokeWidth="4"/><circle cx="50" cy="50" r="42" fill="none" stroke="url(#tg)" strokeWidth="4" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} transform="rotate(-90 50 50)" style={{transition:'stroke-dashoffset 1s linear'}}/><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#6ee7b7"/><stop offset="100%" stopColor="#059669"/></linearGradient></defs><text x="50" y="46" textAnchor="middle" fill="#ecfdf5" fontSize="16" fontWeight="700" fontFamily="Outfit">{String(m).padStart(2,'0')}:{String(s).padStart(2,'0')}</text><text x="50" y="58" textAnchor="middle" fill="#64748b" fontSize="6" letterSpacing="1.5">{mode==='work'?'FOCUS':'BREAK'}</text></svg></div>
        <div className="flex justify-center gap-2 mb-3">
          <button onClick={()=>setRun(!run)} className="flex items-center gap-1.5 px-5 py-2.5 rounded-xl font-semibold text-sm active:scale-95" style={{background:'linear-gradient(135deg,#10b981,#059669)',color:'#fff',border:'none'}}><Icon name={run?'pause':'play'} size={15}/> {run?'Pause':'Start'}</button>
          <button onClick={()=>{setRun(false);setMode('work');setT(W)}} className="flex items-center px-4 py-2.5 rounded-xl active:scale-95" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#94a3b8'}}><Icon name="refresh" size={15}/></button>
        </div>
        <div className="flex items-center justify-center gap-4 text-xs" style={{color:'#64748b'}}><span className="flex items-center gap-1"><Icon name="target" size={12} className="text-emerald-400"/> Sessions: <strong style={{color:'#6ee7b7'}}>{stats.pomodoros}</strong></span><span className="flex items-center gap-1"><Icon name="flame" size={12} style={{color:'#f59e0b'}}/> Focus: <strong style={{color:'#fbbf24'}}>{Math.min(stats.pomodoros,5)}/5</strong></span></div>
      </div>
    </section>
  );
}

/* ===== LOFI ===== */
function Lofi(){
  const[play,setPlay]=useState(false),[mode,setMode]=useState('lofi');
  const ctxRef=useRef(null),nodesRef=useRef([]);
  const modes=[{id:'lofi',name:'Lofi',icon:'music'},{id:'rain',name:'Rain',icon:'coffee'},{id:'forest',name:'Forest',icon:'sparkles'}];
  const start=useCallback(t=>{if(ctxRef.current)ctxRef.current.close();const ctx=new(window.AudioContext||window.webkitAudioContext)();ctxRef.current=ctx;nodesRef.current=[];
    if(t==='lofi'){[220,277.18,329.63].forEach((f,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=(Math.random()-.5)*5;const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=500+i*100;const g=ctx.createGain();g.gain.value=.02;o.connect(fl);fl.connect(g);g.connect(ctx.destination);o.start();nodesRef.current.push(o)})}
    else if(t==='rain'){const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);let la=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;d[i]=(la+.02*w)/1.02;la=d[i];d[i]*=3}const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const fl=ctx.createBiquadFilter();fl.type='bandpass';fl.frequency.value=700;const g=ctx.createGain();g.gain.value=.1;s.connect(fl);fl.connect(g);g.connect(ctx.destination);s.start();nodesRef.current.push(s)}
    else{const b=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*.008;for(let h=1;h<=4;h++)d[i]+=Math.sin(i*h*.001)*.004/h}const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=350;const g=ctx.createGain();g.gain.value=.12;s.connect(fl);fl.connect(g);g.connect(ctx.destination);s.start();nodesRef.current.push(s)}},[]);
  const stop=useCallback(()=>{nodesRef.current.forEach(n=>{try{n.stop()}catch(e){}});nodesRef.current=[];if(ctxRef.current){ctxRef.current.close();ctxRef.current=null}},[]);
  const toggle=useCallback(()=>{if(play){stop();setPlay(false)}else{start(mode);setPlay(true)}},[play,mode,start,stop]);
  const switchM=useCallback(m=>{setMode(m);if(play){stop();start(m)}},[play,start,stop]);
  useEffect(()=>()=>stop(),[stop]);const[r,v]=useInView();
  return(
    <section id="sounds" ref={r} className={`py-6 px-4 max-w-2xl mx-auto ${v?'anim-fade-up':''}`}>
      <div className="glass p-5" style={{borderRadius:20}}>
        <div className="flex items-center justify-between mb-4"><div className="flex items-center gap-2"><Icon name="volume" size={17} className="text-emerald-400"/><h3 className="font-heading font-semibold text-sm" style={{color:'#ecfdf5'}}>Ambient Sounds</h3></div>{play&&<div className="w-2 h-2 rounded-full" style={{background:'#10b981',animation:'pulse 1.5s infinite'}}/>}</div>
        <div className="flex items-end justify-center gap-[2px] h-12 mb-4">{Array.from({length:20},(_,i)=><div key={i} className="rounded-full" style={{width:3,height:play?`${15+Math.random()*85}%`:'8%',background:'linear-gradient(to top,#059669,#6ee7b7)',opacity:play?.7:.15,animation:play?`barAnim ${.4+Math.random()*.5}s ease infinite alternate`:'none',animationDelay:`${i*.03}s`,'--h':`${20+Math.random()*80}%`}}/>)}</div>
        <div className="flex gap-2 mb-4">{modes.map(m=><button key={m.id} onClick={()=>switchM(m.id)} className="flex-1 flex flex-col items-center gap-1 py-2.5 rounded-xl text-xs font-medium active:scale-95" style={{background:mode===m.id?'rgba(16,185,129,.12)':'rgba(255,255,255,.03)',border:`1px solid ${mode===m.id?'rgba(16,185,129,.25)':'rgba(255,255,255,.05)'}`,color:mode===m.id?'#6ee7b7':'#64748b'}}><Icon name={m.icon} size={15}/>{m.name}</button>)}</div>
        <button onClick={toggle} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl font-semibold text-sm active:scale-95" style={{background:play?'rgba(255,255,255,.06)':'linear-gradient(135deg,#10b981,#059669)',border:play?'1px solid rgba(255,255,255,.08)':'none',color:'#fff'}}><Icon name={play?'pause':'play'} size={16}/> {play?'Pause':'Play'}</button>
      </div>
    </section>
  );
}

/* ===== CLASS WALL (existing) ===== */
function ClassWall(){
  const{user}=useAuth();
  const{stats,update}=useStats();
  const[msg,setMsg]=useState('');
  const[posts,setPosts]=useState([]);
  const[loadingPosts,setLoading]=useState(true);
  const[r,v]=useInView();

  useEffect(()=>{
    const unsub=db.collection('messages').orderBy('timestamp','desc').limit(50).onSnapshot(snap=>{setPosts(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false)},()=>setLoading(false));
    return unsub;
  },[]);

  const send=async()=>{if(!msg.trim()||!user)return;const text=msg.trim();setMsg('');try{await db.collection('messages').add({userId:user.uid,displayName:user.displayName||user.email.split('@')[0],text,timestamp:firebase.firestore.FieldValue.serverTimestamp(),color:uidColor(user.uid)});update({postsCount:stats.postsCount+1})}catch(e){}};
  const del=async(id)=>{try{await db.collection('messages').doc(id).delete()}catch(e){}};
  const rots=[-2,1.5,-1,2.5,-1.5,.8];

  return(
    <section id="wall" ref={r} className={`py-6 px-4 max-w-4xl mx-auto ${v?'anim-fade-up':''}`}>
      <div className="flex items-center gap-2.5 mb-5"><div className="flex items-center justify-center rounded-xl" style={{width:32,height:32,background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.2)'}}><Icon name="message-square" size={16} className="text-emerald-400"/></div><div><h2 className="font-heading font-bold text-lg" style={{color:'#ecfdf5'}}>Class Wall</h2><p className="text-xs" style={{color:'#64748b'}}>Live messages from your classmates</p></div><div className="ml-auto flex items-center gap-1.5 px-2.5 py-1 rounded-full" style={{background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.15)'}}><div className="w-1.5 h-1.5 rounded-full" style={{background:'#10b981',animation:'pulse 2s infinite'}}/><span className="text-xs font-medium" style={{color:'#6ee7b7'}}>Live</span></div></div>
      <div className="glass p-4 mb-5" style={{borderRadius:18}}>
        <div className="flex items-center gap-2 mb-3"><div className="flex items-center justify-center rounded-full flex-shrink-0" style={{width:32,height:32,background:`${uidColor(user.uid)}20`,color:uidColor(user.uid),fontSize:13,fontWeight:700,fontFamily:'Outfit'}}>{(user.displayName||user.email||'?')[0].toUpperCase()}</div><span className="text-sm font-medium" style={{color:'#ecfdf5'}}>{user.displayName||user.email.split('@')[0]}</span></div>
        <div className="flex gap-2"><input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send()}} placeholder="Share something with the class..." className="flex-1 px-4 py-2.5 rounded-xl text-sm outline-none" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#ecfdf5'}}/><button onClick={send} className="flex items-center justify-center rounded-xl active:scale-95" style={{width:44,height:44,background:'linear-gradient(135deg,#10b981,#059669)',border:'none',flexShrink:0}}><Icon name="send" size={18} className="text-white"/></button></div>
      </div>
      {loadingPosts?<div className="text-center py-8"><div style={{width:28,height:28,border:'3px solid rgba(16,185,129,.2)',borderTopColor:'#10b981',borderRadius:'50%',animation:'spin .8s linear infinite',margin:'0 auto'}}/></div>:
      posts.length===0?<div className="glass p-8 text-center" style={{borderRadius:18}}><Icon name="message-square" size={32} className="text-emerald-400 mx-auto mb-2" style={{opacity:.3}}/><p className="text-sm" style={{color:'#64748b'}}>No messages yet. Be the first to post!</p></div>:
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">{posts.map((p,i)=>{const isMine=p.userId===user.uid;return<div key={p.id} className="glass p-3.5 transition-transform" style={{borderRadius:16,borderLeft:`3px solid ${p.color||'#10b981'}`,transform:`rotate(${rots[i%rots.length]}deg)`,transition:'.25s'}} onMouseEnter={e=>e.currentTarget.style.transform='rotate(0)'} onMouseLeave={e=>e.currentTarget.style.transform=`rotate(${rots[i%rots.length]}deg)`}><div className="flex items-center justify-between mb-1.5"><div className="flex items-center gap-2"><div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold" style={{background:`${p.color||'#10b981'}20`,color:p.color||'#10b981'}}>{(p.displayName||'?')[0].toUpperCase()}</div><span className="text-xs font-semibold" style={{color:'#ecfdf5'}}>{p.displayName||'Anonymous'}</span></div><div className="flex items-center gap-2"><span className="text-xs" style={{color:'#475569',fontSize:9}}>{timeAgo(p.timestamp)}</span>{isMine&&<button onClick={()=>del(p.id)} style={{background:'transparent',border:'none',color:'#475569',cursor:'pointer',padding:2}}><Icon name="trash" size={12}/></button>}</div></div><p className="text-xs" style={{color:'#cbd5e1',lineHeight:1.5}}>{p.text}</p></div>})}</div>}
    </section>
  );
}

/* ===== BADGES ===== */
function Badges(){
  const{stats}=useStats();const[r,v]=useInView();
  const badges=[
    {id:'early',name:'Early Bird',desc:'Study before 8 AM',icon:'sunrise',ok:stats.earliestStudy,progress:stats.earliestStudy?100:0},
    {id:'night',name:'Night Owl',desc:'Study after 10 PM',icon:'moon',ok:stats.latestStudy,progress:stats.latestStudy?100:0},
    {id:'streak',name:'7-Day Streak',desc:'Study every day',icon:'flame',ok:stats.streakDays>=7,progress:Math.min(stats.streakDays/7*100,100),detail:`${stats.streakDays||0}/7 days`},
    {id:'focus',name:'Focus Champ',desc:'5 Pomodoros done',icon:'target',ok:stats.pomodoros>=5,progress:Math.min(stats.pomodoros/5*100,100),detail:`${stats.pomodoros}/5 sessions`},
    {id:'polyglot',name:'Polyglot',desc:'3+ languages',icon:'globe',ok:(stats.languages||[]).length>=3,progress:Math.min((stats.languages||[]).length/3*100,100),detail:`${(stats.languages||[]).length}/3`},
    {id:'bookworm',name:'Bookworm',desc:'20+ hours/week',icon:'book-open',ok:stats.studyHours>=20,progress:Math.min(stats.studyHours/20*100,100),detail:`${stats.studyHours}h`},
    {id:'quiz',name:'Quiz Master',desc:'10 correct answers',icon:'brain',ok:stats.quizCorrect>=10,progress:Math.min(stats.quizCorrect/10*100,100),detail:`${stats.quizCorrect}/10`},
    {id:'social',name:'Team Player',desc:'5 posts made',icon:'users',ok:stats.postsCount>=5,progress:Math.min(stats.postsCount/5*100,100),detail:`${stats.postsCount}/5`}
  ];
  const earned=badges.filter(b=>b.ok).length;
  return(
    <section id="badges" ref={r} className={`py-6 px-4 max-w-4xl mx-auto ${v?'anim-fade-up':''}`}>
      <div className="flex items-center gap-2.5 mb-2"><div className="flex items-center justify-center rounded-xl" style={{width:32,height:32,background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.2)'}}><Icon name="award" size={16} className="text-emerald-400"/></div><div><h2 className="font-heading font-bold text-lg" style={{color:'#ecfdf5'}}>Achievements</h2><p className="text-xs" style={{color:'#64748b'}}>Earned through real activity</p></div></div>
      <div className="glass p-3 mb-5 mt-3" style={{borderRadius:14}}><div className="flex items-center justify-between"><span className="text-xs" style={{color:'#94a3b8'}}>Progress</span><span className="text-xs font-bold" style={{color:'#6ee7b7'}}>{earned}/{badges.length}</span></div><div className="w-full rounded-full overflow-hidden mt-2" style={{height:6,background:'rgba(255,255,255,.06)'}}><div className="h-full rounded-full" style={{width:`${earned/badges.length*100}%`,background:'linear-gradient(90deg,#10b981,#6ee7b7)',transition:'.5s'}}/></div></div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">{badges.map(b=><div key={b.id} className={`glass p-3 text-center transition-all ${b.ok?'glass-hover':''}`} style={{borderRadius:18,borderTop:b.ok?'2px solid #10b981':'2px solid rgba(255,255,255,.04)',opacity:b.ok?1:.5}}><div className="mx-auto mb-2 flex items-center justify-center rounded-full" style={{width:44,height:44,background:b.ok?'rgba(16,185,129,.12)':'rgba(255,255,255,.03)',border:`1px solid ${b.ok?'rgba(16,185,129,.25)':'rgba(255,255,255,.05)'}`}}><Icon name={b.icon} size={20} className={b.ok?'text-emerald-400':'text-slate-600'}/></div><h4 className="font-heading font-semibold text-xs mb-0.5" style={{color:b.ok?'#ecfdf5':'#475569'}}>{b.name}</h4><p className="text-xs mb-2" style={{color:b.ok?'#64748b':'#334155',fontSize:9}}>{b.desc}</p><div className="w-full rounded-full overflow-hidden mb-1" style={{height:3,background:'rgba(255,255,255,.06)'}}><div className="h-full rounded-full" style={{width:`${b.progress}%`,background:b.ok?'#10b981':'rgba(16,185,129,.3)',transition:'.5s'}}/></div><span className="text-xs" style={{color:b.ok?'#6ee7b7':'#475569',fontSize:9}}>{b.ok?'Earned':b.detail||`${Math.round(b.progress)}%`}</span></div>)}</div>
    </section>
  );
}

/* ===== AI CHAT ===== */
function AIChat(){
  const[open,setOpen]=useState(false);
  const[msgs,setMsgs]=useState([{id:1,role:'ai',text:"Welcome! I can help with quizzes, study tips, and subject guidance.\n\nTry the Quizzes section for interactive tests!"}]);
  const[input,setInput]=useState('');
  const[typing,setTyping]=useState(false);
  const scrollRef=useRef(null),inputRef=useRef(null);
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight},[msgs,typing]);
  useEffect(()=>{if(open&&inputRef.current)setTimeout(()=>inputRef.current.focus(),300)},[open]);
  const send=(text)=>{if(!text.trim())return;setMsgs(p=>[...p,{id:Date.now(),role:'user',text:text.trim()}]);setInput('');setTyping(true);setTimeout(()=>{const r=getAI(text);setMsgs(p=>[...p,typeof r==='object'?{id:Date.now()+1,role:'ai',text:`Quiz: (${r.data.s})\n\n${r.data.q}`,quiz:r.data}:{id:Date.now()+1,role:'ai',text:r}]);setTyping(false)},800+Math.random()*600)};
  const answerQuiz=(qi,ans)=>{setMsgs(p=>p.map(m=>m.quiz===qi?{...m,answered:ans}:m));setTimeout(()=>{setMsgs(p=>[...p,{id:Date.now(),role:'ai',text:ans===qi.c?`Correct! ${qi.o[qi.c]}`:`Answer: ${qi.o[qi.c]}`}])},400)};
  return(
    <>
      {!open&&<button onClick={()=>setOpen(true)} className="fixed flex items-center justify-center rounded-full" style={{bottom:20,right:20,zIndex:90,width:56,height:56,background:'linear-gradient(135deg,#10b981,#059669)',boxShadow:'0 4px 20px rgba(16,185,129,.35)',animation:'glow 2.5s ease-in-out infinite',border:'none'}}><Icon name="brain" size={26} className="text-white"/></button>}
      {open&&<div className="fixed" style={{inset:0,zIndex:95,display:'flex',flexDirection:'column'}}>
        <div onClick={()=>setOpen(false)} className="absolute inset-0" style={{background:'rgba(0,0,0,.4)'}}/>
        <div className="relative glass flex flex-col self-end w-full" style={{maxWidth:440,height:'78vh',maxHeight:600,margin:'12px',borderRadius:20,animation:'slideUp .35s cubic-bezier(.4,0,.2,1)'}}>
          <div className="flex items-center justify-between p-4" style={{borderBottom:'1px solid rgba(255,255,255,.06)'}}>
            <div className="flex items-center gap-2.5"><div className="flex items-center justify-center rounded-xl" style={{width:36,height:36,background:'linear-gradient(135deg,#10b981,#059669)'}}><Icon name="brain" size={20} className="text-white"/></div><div><h3 className="font-heading font-semibold text-sm" style={{color:'#ecfdf5'}}>AI Study Assistant</h3><div className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full" style={{background:'#10b981'}}/><span className="text-xs" style={{color:'#6ee7b7'}}>Online</span></div></div></div>
            <button onClick={()=>setOpen(false)} className="flex items-center justify-center rounded-full" style={{width:32,height:32,background:'rgba(255,255,255,.06)'}}><Icon name="x" size={16} className="text-slate-400"/></button>
          </div>
          <div ref={scrollRef} className="flex-1 p-4 space-y-3 chat-scroll" style={{overflowY:'auto'}}>
            {msgs.map(m=><div key={m.id} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={m.role==='user'?'':'flex gap-2 items-start'}>{m.role==='ai'&&<div className="flex-shrink-0 flex items-center justify-center rounded-lg mt-0.5" style={{width:24,height:24,background:'rgba(16,185,129,.15)'}}><Icon name="bot" size={14} className="text-emerald-400"/></div>}<div className="rounded-2xl px-3.5 py-2.5 max-w-[85%]" style={{background:m.role==='user'?'linear-gradient(135deg,#10b981,#059669)':'rgba(255,255,255,.06)',border:m.role==='user'?'none':'1px solid rgba(255,255,255,.06)',borderRadius:m.role==='user'?'18px 18px 4px 18px':'18px 18px 18px 4px'}}><p className="text-sm whitespace-pre-line" style={{color:m.role==='user'?'#fff':'#d1fae5',lineHeight:1.5}}>{m.text}</p>{m.quiz&&m.answered===undefined&&<div className="mt-2 space-y-1.5">{m.quiz.o.map((o,i)=><button key={i} onClick={()=>answerQuiz(m.quiz,i)} className="w-full text-left px-3 py-2 rounded-xl text-xs font-medium" style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',color:'#d1fae5',transition:'.2s'}}>{String.fromCharCode(65+i)}) {o}</button>)}</div>}</div></div></div>)}
            {typing&&<div className="flex gap-2 items-start"><div className="flex-shrink-0 flex items-center justify-center rounded-lg" style={{width:24,height:24,background:'rgba(16,185,129,.15)'}}><Icon name="bot" size={14} className="text-emerald-400"/></div><div className="rounded-2xl px-4 py-3 flex gap-1.5" style={{background:'rgba(255,255,255,.06)'}}>{[0,1,2].map(i=><div key={i} className="rounded-full" style={{width:6,height:6,background:'#6ee7b7',animation:`typing .6s ease ${i*.12}s infinite`}}/>)}</div></div>}
          </div>
          <div className="px-4 pb-2 flex gap-2 overflow-x-auto day-tabs">{['Quiz me','Study tips','Motivate me','Help'].map(q=><button key={q} onClick={()=>send(q)} className="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium active:scale-95" style={{background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.2)',color:'#6ee7b7',whiteSpace:'nowrap'}}>{q}</button>)}</div>
          <div className="p-3" style={{borderTop:'1px solid rgba(255,255,255,.06)'}}><div className="flex gap-2"><input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')send(input)}} placeholder="Ask me anything..." className="flex-1 px-4 py-2.5 rounded-xl text-sm outline-none" style={{background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.08)',color:'#ecfdf5'}}/><button onClick={()=>send(input)} className="flex items-center justify-center rounded-xl active:scale-95" style={{width:44,height:44,background:'linear-gradient(135deg,#10b981,#059669)',border:'none',flexShrink:0}}><Icon name="send" size={18} className="text-white"/></button></div></div>
        </div>
      </div>}
    </>
  );
}

function Footer(){return(<footer className="py-10 px-4 text-center" style={{borderTop:'1px solid rgba(255,255,255,.04)'}}><div className="flex items-center justify-center gap-2 mb-2"><div className="flex items-center justify-center rounded-xl font-heading" style={{width:28,height:28,background:'linear-gradient(135deg,#10b981,#059669)',fontSize:11,fontWeight:800,color:'#fff',letterSpacing:'-0.5px'}}>G11</div><span className="font-heading font-bold text-sm" style={{color:'#ecfdf5'}}>11D Hub</span></div><p className="text-xs" style={{color:'#475569'}}>Built for Class 11D</p></footer>)}

function ScrollTop(){const[s,setS]=useState(false);useEffect(()=>{const h=()=>setS(window.scrollY>400);window.addEventListener('scroll',h,{passive:true});return()=>window.removeEventListener('scroll',h)},[]);if(!s)return null;return <button onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} className="fixed flex items-center justify-center rounded-full" style={{bottom:84,right:20,zIndex:40,width:40,height:40,background:'rgba(16,185,129,.15)',border:'1px solid rgba(16,185,129,.25)',backdropFilter:'blur(12px)'}}><Icon name="arrow-up" size={18} className="text-emerald-400"/></button>}

/* ═══════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════ */
function MainApp(){
  const[menu,setMenu]=useState(false);
  const navTo=id=>{setMenu(false);setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}),350)};
  return(
    <StatsProvider>
      <TeacherProvider>
        <div className="relative min-h-screen" style={{paddingBottom:80}}>
          <SlideMenu open={menu} onClose={()=>setMenu(false)} onNav={navTo}/>
          <Header onMenu={()=>setMenu(true)}/>
          <main>
            <Hero/>
            <Timetable/>
            <Analytics/>
            <section id="subjects" className="py-6 px-4 max-w-5xl mx-auto">
              <div className="flex items-center gap-2.5 mb-5"><div className="flex items-center justify-center rounded-xl" style={{width:32,height:32,background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.2)'}}><Icon name="book-open" size={16} className="text-emerald-400"/></div><div><h2 className="font-heading font-bold text-lg" style={{color:'#ecfdf5'}}>Subject Modules</h2><p className="text-xs" style={{color:'#64748b'}}>Flashcards, resources & vocabulary</p></div></div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">{SUBJECTS.map(s=><SubjectCard key={s.id} s={s}/>)}</div>
            </section>
            <QuizSection/>
            <Pomodoro/>
            <Lofi/>
            <ClassChat/>
            <HomeworkSection/>
            <MarksSection/>
            <ClassWall/>
            <Badges/>
          </main>
          <Footer/>
          <AIChat/>
          <ScrollTop/>
        </div>
      </TeacherProvider>
    </StatsProvider>
  );
}

function AppRouter(){
  const{user,loading}=useAuth();
  if(loading)return(<div className="fixed inset-0 flex items-center justify-center" style={{background:'#060b14'}}><div className="text-center"><div style={{width:40,height:40,border:'3px solid rgba(16,185,129,.2)',borderTopColor:'#10b981',borderRadius:'50%',animation:'spin 1s linear infinite',margin:'0 auto 12px'}}/><p className="font-heading" style={{color:'#6ee7b7',fontSize:13,letterSpacing:3,textTransform:'uppercase'}}>11D Hub</p></div></div>);
  if(!user)return <LoginScreen/>;
  return <MainApp/>;
}

function App(){return <AuthProvider><AppRouter/></AuthProvider>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
